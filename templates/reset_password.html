{% extends "base.html" %}
{% set page_class = "auth-page" %}

{% block title %}Reset Password | AI Video Studio{% endblock %}

{% block content %}
<section class="auth-card">
    <p class="auth-eyebrow">Secure update</p>
    <h1 class="auth-title">New Password</h1>
    <p class="auth-subtitle">Choose a strong password you have not used before and confirm it to finish the reset.</p>

    <form method="POST" class="auth-form">
        <div class="field-stack">
            <label class="pill-field trailing-icon">
                <input name="password" type="password" placeholder="New password" required>
                <span class="field-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                        <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                    </svg>
                </span>
            </label>

            <label class="pill-field trailing-icon">
                <input name="confirm_password" type="password" placeholder="Confirm new password" required>
                <span class="field-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 6L9 17l-5-5"></path>
                    </svg>
                </span>
            </label>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%;">Update password</button>
    </form>

    <div class="auth-links">
        <a href="/" class="ghost-link">Back to login</a>
    </div>
</section>
{% endblock %}
