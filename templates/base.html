<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Video Studio{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="{{ page_class | default('app-page') }}">
    <div class="page-shell">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <section class="flash-stack {% if page_class == 'auth-page' %}flash-auth{% endif %}">
            {% for category, message in messages %}
            <div class="flash flash-{{ category }}">
                <span class="flash-label">{{ category|capitalize }}</span>
                <span>{{ message }}</span>
            </div>
            {% endfor %}
        </section>
        {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
