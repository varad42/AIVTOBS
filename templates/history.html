{% extends "base.html" %}

{% block title %}History | AI Video Studio{% endblock %}

{% block content %}
<div id="reactPageRoot"></div>
<script id="reactPageState" type="application/json">
{
  "page": "history",
  "jobs": [
    {% for job in jobs %}
    {
      "job_id": {{ (job.get("job_id") or "") | tojson }},
      "file": {{ (job.get("file") or "") | tojson }},
      "status": {{ (job.get("status") or "") | tojson }},
      "transcription_provider": {{ (job.get("transcription_provider", "whisper")) | tojson }},
      "summary_model": {{ (job.get("summary_model", "-")) | tojson }},
      "summary_file": {{ (job.get("summary_file") or "") | tojson }},
      "blog_file": {{ (job.get("blog_file") or "") | tojson }}
    }{% if not loop.last %},{% endif %}
    {% endfor %}
  ]
}
</script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="{{ url_for('static', filename='js/pages-react.js') }}"></script>
{% endblock %}
