{% extends "base.html" %}
{% set page_class = "auth-page" %}

{% block title %}Register | AI Video Studio{% endblock %}

{% block content %}
<section class="auth-card">
    <p class="auth-eyebrow">New account</p>
    <h1 class="auth-title">Create Access</h1>
    <p class="auth-subtitle">Set up your workspace to summarize long videos and generate blog content with a single flow.</p>

    <form method="POST" class="auth-form">
        <div class="field-stack">
            <label class="pill-field">
                <span class="field-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21a8 8 0 0 0-16 0"></path>
                        <circle cx="12" cy="8" r="4"></circle>
                    </svg>
                </span>
                <input name="email" type="email" placeholder="Email address" value="{{ email or '' }}" required>
            </label>

            <label class="pill-field trailing-icon">
                <input name="password" type="password" placeholder="Password (min 8 characters)" required>
                <span class="field-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3l7 4v5c0 5-3.5 7.5-7 9-3.5-1.5-7-4-7-9V7l7-4z"></path>
                    </svg>
                </span>
            </label>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%;">Register</button>
    </form>

    <div class="auth-links">
        <a href="/" class="ghost-link">Back to login</a>
    </div>
</section>
{% endblock %}
