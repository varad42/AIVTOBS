{% extends "base.html" %}

{% block title %}Blog | AI Video Studio{% endblock %}

{% block content %}
<section class="content-panel">
    <div class="section-header">
        <div>
            <p class="auth-eyebrow">Output</p>
            <h1 class="section-title">Generated Blog</h1>
        </div>
        <div class="tag-row">
            <span class="tag">Model: {{ model_name|upper }}</span>
            <span class="tag">Video: {{ display_name }}</span>
        </div>
    </div>

    <div class="text-content" style="margin-top: 22px;">{{ blog }}</div>

    <div class="action-row" style="margin-top: 28px;">
        <a class="btn-primary" href="/download_blog/{{ job_id }}">Download Blog</a>
    </div>
</section>
{% endblock %}
